<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Police Route – version retirée</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0f2347;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
main{max-width:520px;background:#16305e;border:1px solid #c9a227;border-radius:14px;padding:24px}h1{margin:0 0 8px;font-size:22px;color:#c9a227}p{margin:8px 0}</style></head>
<body><main><h1>Version retirée</h1><p>Cette version en ligne de Police Route n'est plus disponible.</p><p>L'application s'utilise désormais uniquement dans <b>Grist</b>.</p><p>Si vous l'aviez ajoutée à l'écran d'accueil de votre téléphone, vous pouvez supprimer l'icône.</p></main>
<script>
/* Supprime la copie hors connexion installée sur l'appareil */
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}catch(e){}
</script></body></html>
